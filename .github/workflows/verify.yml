name: Check research package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Replay exact historical evidence and verify manifest
        run: python3 -B VERIFY_PACKAGE.py
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formalization
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Fetch pinned dependencies and the required Mathlib cache
        working-directory: formalization
        run: |
          lake exe cache get TwoBin.lean
          git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.toml
      - name: Compile algebraic criterion, audit all axioms and reject false claims
        run: python3 -B formalization/build_and_audit.py --receipt "$RUNNER_TEMP/lean-audit.json"
      - name: Compare actual Lean source counts with the separate Python oracle
        run: python3 -B scripts/check_source_model.py --receipt "$RUNNER_TEMP/source-model-check.json"
      - name: Recheck package membership after builds
        run: python3 -B -c 'import VERIFY_PACKAGE as v; v.verify(v.ROOT)'
